services:
  db:
    image: postgres:16-alpine
    container_name: vagamatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vagamatch
      POSTGRES_USER: vagamatch
      POSTGRES_PASSWORD: vagamatch_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - vagamatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vagamatch -d vagamatch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vagamatch_pgdata:
